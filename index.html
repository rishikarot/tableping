function validateSettings(s){assert([0,5,10,15,30,60].includes(s.refreshSeconds??5),'Choose a supported refresh interval.');assert(s&&['sharing','cleanAfter','notifications'].every(k=>typeof s[k]==='boolean'),'Invalid settings.');['duration','diningLead','resLead'].forEach(k=>assert(Number.isFinite(s[k])&&s[k]>=0&&s[k]<=1440,'Invalid timing setting.'));assert(s.duration>=5,'Dining duration must be at least 5 minutes.');assert(validZone(s.timezone),'Choose a supported timezone.');assert(/^#[0-9a-f]{6}$/i.test(s.primary)&&/^#[0-9a-f]{6}$/i.test(s.secondary),'Invalid theme colour.');assert(contrast(s.primary,'#ffffff')>=4.5&&contrast(s.secondary,'#26352e')>=4.5,'Choose colours with accessible text contrast.');}

const time=t=>new Intl.DateTimeFormat('en',{hour:'numeric',minute:'2-digit',timeZone:displayZone()}).format(t);

function phone(value,country='IN'){const raw=String(value||'').trim();if(!raw)return '';assert(countryOptions.some(c=>c.id===country),'Choose a valid phone country.');const p=libphonenumber.parsePhoneNumberFromString(raw.startsWith('00')?'+'+raw.slice(2):raw,country);assert(p&&p.isPossible()&&p.isValid()&&!p.ext,'Enter a valid mobile / phone number for the selected country, or include its international +code.');return p.number}

function parseGuest(text,size){const tokens=text.trim().split(/\s+/).filter(Boolean),names=[],counts=[],phones=[];for(const token of tokens){if(/^\+?\d{9,15}$/.test(token))phones.push(token);else if(/^\d+$/.test(token)&&Number(token)<=100&&Number(token)>0)counts.push(Number(token));else names.push(token)}return {name:names.join(' '),size:counts.length===1?counts[0]:size||'',phone:phones[0]||'',areaId:'',ambiguous:counts.length>1||phones.length>1||tokens.some(t=>/^\d+$/.test(t)&&t.length>3&&t.length<9)}}
function checkParty(p){assert(Number.isInteger(p.size)&&p.size>0&&p.size<=100,'Party size must be a whole number from 1 to 100.');assert(p.name.length<=100,'Guest name is too long.');assert(!p.areaId||R().areas.some(a=>a.id===p.areaId),'Choose an existing area.');}
function addParty(p,status='Waiting'){checkParty(p);const x={...p,id:uid(),name:p.name.trim()||'Walk-in '+(++R().counter),status,created:now()};delete x.ambiguous;if(x.phone){let g=R().guests.find(g=>g.phone===x.phone);if(!g){g={id:uid(),name:x.name,phone:x.phone};R().guests.push(g)}x.guestId=g.id}R().parties.push(x);return x}
function seat(p,u,resId=''){assert(available(u,p,resId),'This table is unavailable, has insufficient seats or conflicts with a reservation. Choose another table.');assert(!R().sessions.some(s=>s.partyId===p.id&&s.end===null),'This party is already seated.');p.status='Dining';R().sessions.push({id:uid(),partyId:p.id,tableIds:[...u.ids],start:now(),end:null,duration:R().settings.duration});u.ids.forEach(id=>{table(id).state='Dining';table(id).since=now()});if(resId){const v=R().reservations.find(v=>v.id===resId);assert(v?.status==='Upcoming','Reservation is no longer available.');v.status='Seated';v.partyId=p.id}}

function validateMerge(ids){assert(ids.length>=2,'Select at least two tables.');const us=ids.map(unit);assert(us.every(u=>u&&!u.merge&&u.state==='Free'),'Only unmerged free tables can be merged.');assert(new Set(us.map(u=>u.areaId)).size===1,'Choose tables in the same area.');assert(!us.some(u=>conflict(u.ids,now(),now()+R().settings.duration*MIN)),'A table has a conflicting reservation.');return us}

function zoneParts(ts,zone){const v={};for(const p of new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(ts)){if(p.type!=='literal')v[p.type]=p.value}return v}

let sheetScrollY=0;
function showModal(title,body,kind=''){
 const dialog=$('#modal'),opening=!dialog.open;
 if(opening){lastFocus=document.activeElement;sheetScrollY=window.scrollY||0;}
 modalKind=kind;dialog.dataset.kind=kind;
 $('#modal-title').innerHTML=esc(title)+'<span class="sheet-heart">'+ico('heart')+'</span>';
 $('#modal-foot').innerHTML='';$('#modal-body').innerHTML=body;
 $('#modal [data-action=close]').innerHTML=ico('close');dockSheetActions();keyboardInset();
 if(opening){
  if(typeof dialog.showModal==='function')dialog.showModal();
  else{dialog.setAttribute('open','');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');$('#root').inert=true;document.body.dataset.sheetFallback='true';}
  document.body.dataset.sheetOpen='true';document.body.style.top=-sheetScrollY+'px';
 }
 document.body.dataset.composerHidden='false';$('#modal-body').scrollTop=0;
 $('#modal [data-action=close]').focus({preventScroll:true});
}
function finishSheetClose(){
 if(document.body.dataset.sheetOpen!=='true')return;
 delete document.body.dataset.sheetOpen;delete document.body.dataset.sheetFallback;document.body.style.top='';$('#root').inert=false;
 window.scrollTo(0,sheetScrollY);modalKind='';
 if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});
 if(R()){document.documentElement.style.setProperty('--primary',R().settings.primary);document.documentElement.style.setProperty('--secondary',R().settings.secondary)}
}
function closeModal(){const dialog=$('#modal');if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');finishSheetClose();}

function showTable(id){const u=unit(id);assert(u,'This table is no longer available.');let ss=activeSessions(u.ids),vs=reservationsFor(u.ids);showModal(u.code,`<div class="row wrap"><span class="badge">${u.state}</span><span class="muted">${esc(areaName(u.areaId))} · ${u.capacity} seats</span></div>${ss.length?`<h3>Currently dining</h3>${ss.map(s=>`<div class="option row"><div class="grow"><strong>${esc(party(s.partyId).name)}</strong><div class="hint">${party(s.partyId).size} guests · ${elapsed(s.start)} · Expected ${s.duration}m</div></div>${btn('End dining','end-session',s.id)}</div>`).join('')}`:'<div class="spacer"></div>'}<div class="seat-capacity">${seatFeedback(u.capacity,partySize,occupancy(u))}</div>${u.state==='Dining'&&!R().settings.sharing&&occupancy(u)<u.capacity?`<p class="notice">Sharing seats keeps each party’s timer and checkout separate.</p>${allowed('admin')?btn('Enable table sharing','enable-sharing',u.id):'<p class="hint">Ask an Admin to enable table sharing in Operations.</p>'}`:''}<div class="actions">${u.state==='Free'||u.state==='Dining'&&R().settings.sharing&&occupancy(u)<u.capacity?btn(u.state==='Dining'?'Share remaining seats':'Seat guests','table-new',u.id,'primary')+btn('Assign waiting party','table-waiting',u.id):''}${btn('Reserve','table-reserve',u.id)}${u.state!=='Dining'?btn(u.state==='Cleaning'?'Mark free':'Mark cleaning',u.state==='Cleaning'?'table-free':'table-clean',u.id):''}${u.state==='Free'&&!u.merge&&allowed('merge')?btn('Merge tables','merge-start',u.id):''}${u.merge&&u.state!=='Dining'&&allowed('merge')?btn('Split tables','unmerge',u.id):''}</div>${vs.length?`<h3>Reservations</h3>${vs.map(v=>`<div class="option"><div class="row between"><strong>${esc(v.name)} · ${v.size}</strong><span class="badge reserved">${dateTime(v.start)}</span></div><p class="hint">${esc(v.note||'No special requests')}</p><div class="actions">${btn('Seat','reservation-seat',v.id,'primary')}${btn('Edit','reservation-edit',v.id)}${btn('Cancel','reservation-cancel',v.id,'danger')}${btn('No-show','reservation-noshow',v.id)}</div></div>`).join('')}`:''}<div class="error" role="alert"></div>`, 'table:'+id)}

/* Conservative estimate: compatible parties ahead, expected dining ends,
   a five-minute cleaning allowance and reservation windows. Never auto-release. */
function waitEstimate(p){
 if(!Number.isInteger(p.size)||p.size<1)return {label:'Enter party size',detail:'Choose how many guests are arriving.'};
 if(!R().parties.some(x=>x.status==='Waiting'&&x.id!==p.id&&(!p.created||x.created<=p.created))&&units().some(u=>available(u,p)))return {label:'Available now',minutes:0,ahead:0,detail:'A suitable table is free. Confirm seating with the host.'};
 const slotList=units().filter(u=>(!p.areaId||u.areaId===p.areaId)&&u.capacity>=p.size);
 if(!slotList.length)return {label:'Estimate unavailable',detail:'This party needs a merge or a different area. Ask a supervisor.'};
 const slots=units().map(u=>{const ss=activeSessions(u.ids);let ready=now();if(ss.length){const end=Math.max(...ss.map(x=>x.start+x.duration*MIN));if(end<=now())return null;ready=end+(R().settings.cleanAfter?5*MIN:0)}else if(u.state==='Cleaning')ready=now()+5*MIN;return {u,ready}}).filter(Boolean);
 const queue=R().parties.filter(x=>x.status==='Waiting'&&x.id!==p.id&&(!p.created||x.created<=p.created)).sort((a,b)=>a.created-b.created);
 const choose=x=>{const eligible=slots.filter(t=>t.u.capacity>=x.size&&(!x.areaId||t.u.areaId===x.areaId)).map(t=>{let start=t.ready;for(let i=0;i<100;i++){const c=conflict(t.u.ids,start,start+R().settings.duration*MIN);if(!c)break;start=c.end+5*MIN}return {slot:t,start}}).filter(t=>t.start-now()<24*60*MIN).sort((a,b)=>a.start-b.start||a.slot.u.capacity-b.slot.u.capacity);return eligible[0]};
 let ahead=0;for(const q of queue){const pick=choose(q);if(pick){pick.slot.ready=pick.start+(R().settings.duration+5)*MIN;if(!p.areaId||!q.areaId||q.areaId===p.areaId)ahead++}}
 const pick=choose(p);if(!pick)return {label:'Estimate unavailable',detail:'Suitable tables are overdue or cannot be projected reliably. Check with the floor team.'};
 const minutes=Math.max(0,Math.ceil((pick.start-now())/MIN));
 return {label:minutes===0?'Available now':`Approx. ${Math.max(5,Math.floor(minutes/5)*5)}–${Math.ceil(minutes/5)*5+10} min`,minutes,ahead,detail:`${ahead?ahead+' earlier parties considered. ':''}Based on expected dining times, reservations and a 5-minute cleaning allowance. Not a guarantee; confirm with the floor team.`};
}
function availabilityHTML(p,interactive=false){if(!Number.isInteger(p.size)||p.size<1)return '<p class="hint">Choose a party size to see suitable tables.</p>';const us=units().filter(u=>available(u,p)).sort((a,b)=>a.capacity-occupancy(a)-b.capacity+occupancy(b));const e=waitEstimate(p);return `<div class="availability-heading"><strong>${us.length?'Suitable tables':'No suitable table right now'}</strong><span class="badge ${us.length?'':'attention'}">${esc(e.label)}</span></div>${us.length?`<div class="available-chips">${us.map(u=>interactive?btn(`Seat ${p.size} at ${esc(u.code)} <small>${u.capacity-occupancy(u)} available · ${u.capacity-occupancy(u)-p.size===0?'Exact fit':(u.capacity-occupancy(u)-p.size)+' spare'}</small>`,'guest-pick',u.id):`<span class="available-table">${esc(u.code)} · ${u.capacity-occupancy(u)} seats</span>`).join('')}</div>`:''}<p class="estimate-note">${esc(e.detail)}</p>`}

function assignment(p,existing='',resId=''){currentParty=clone(p);assignmentPartyId=existing;assignmentReservation=resId;const us=units().filter(u=>available(u,p,resId)).sort((a,b)=>(preferredTable===a.id?-1000:a.capacity-occupancy(a)-p.size)-(preferredTable===b.id?-1000:b.capacity-occupancy(b)-p.size));const merges=!resId?mergeSuggestions(p):[];showModal('Choose a table',`<div class="notice"><strong>${esc(p.name||'Walk-in')} · ${p.size} guests</strong><br>${esc(areaName(p.areaId))} · Choose a table to seat</div><div class="wait-summary"><strong>${esc(waitEstimate(p).label)}</strong><p class="estimate-note">${esc(waitEstimate(p).detail)}</p></div><h3>Suitable tables</h3>${us.map((u,i)=>`<div class="option row"><div class="grow"><strong>${esc(u.code)}</strong><div class="hint">${esc(areaName(u.areaId))} · ${u.capacity-occupancy(u)} available · ${p.size} needed ${i===0?'· Best fit':''}</div>${seatFeedback(u.capacity,p.size,occupancy(u))}</div>${btn('Seat '+p.size,'seat-here',u.id,'primary')}</div>`).join('')||empty('No suitable table.','Add the party to Waiting, or review the available merges.')}${merges.length?`<h3>Merge options</h3><p class="hint">Confirm the tables are physically suitable to join.</p>${merges.map(m=>`<div class="option row"><div class="grow"><strong>${esc(m.label)}</strong><div class="hint">${m.cap} combined seats · ${p.size} needed</div>${seatFeedback(m.cap,p.size)}</div>${btn('Merge & seat','merge-seat',m.ids.join(','))}</div>`).join('')}`:''}<div class="error" role="alert"></div><div class="actions">${!existing&&!resId?btn('Add to waiting','add-waiting','','primary'):''}${!existing&&!resId?btn('Edit details','edit-parsed'):btn('Back','close')}</div>`,'assignment');if(directTable){const id=directTable;directTable='';actions['seat-here'](id)}}
function queueDetail(id){const p=party(id);assert(p?.status==='Waiting','This party is no longer waiting.');showModal(p.name,`<p>${p.size} guests · Waiting ${elapsed(p.created)}</p><p class="muted">${esc(areaName(p.areaId))}</p>${p.phone?`<p>${esc(p.phone)}</p>`:''}<div class="spacer"></div><div class="notice">${esc(waitEstimate(p).label)}. ${esc(waitEstimate(p).detail)} “Mark contacted” records manual contact; no message is sent.</div><div class="actions">${btn('Seat','queue-seat',id,'primary')}${btn('Edit','queue-edit',id)}${btn(p.contacted?'Contact recorded':'Mark contacted','queue-contact',id)}${btn('Cancel party','queue-cancel',id,'danger')}${btn('Mark no-show','queue-noshow',id)}</div><div class="error" role="alert"></div>`,'queue')}
function reservationForm(ids=[],existing=''){const v=existing?R().reservations.find(v=>v.id===existing):{name:'',phone:'',size:partySize||2,start:now()+60*MIN,end:now()+120*MIN,tableIds:ids,note:''};assert(v,'Reservation not found.');reservationDraft={id:existing};showModal(existing?'Edit reservation':'Reserve a table',`<form id="reservation-form"><p class="hint">Times shown and entered in ${esc(displayZone())}.</p><div class="formgrid"><div>${field('res-name','Guest name','text',v.name,'required maxlength="100"')}</div><div>${field('res-size','Party size','number',v.size,'required min="1" max="100" step="1"')}</div><div class="full">${countryPicker('res-country',guessCountry(v.phone))}</div><div>${field('res-phone','Mobile number','tel',v.phone,'maxlength="20"')}</div><div>${field('res-start','Date & time','datetime-local',tzInput(v.start),'required')}</div><div>${field('res-duration','Duration (minutes)','number',(v.end-v.start)/MIN,'required min="5" max="1440" step="1"')}</div></div><details id="dst-options" class="dst-options"><summary>Clock-change options</summary><p class="hint">Only needed when a local time happens twice as clocks go back.</p>${select('dst-fold','Which occurrence?',[['','Choose if needed'],['earlier','First occurrence'],['later','Second occurrence']],existing&&wallCandidates(tzInput(v.start)).length>1?(v.start===wallCandidates(tzInput(v.start))[0]?'earlier':'later'):'')}</details><label>Choose tables</label><div>${units().map(u=>`<label class="check option"><input type="checkbox" name="res-table" value="${u.id}" ${u.ids.some(id=>v.tableIds.includes(id))?'checked':''}>${esc(u.code)} · ${u.capacity} seats · ${esc(areaName(u.areaId))}</label>`).join('')}</div><label for="res-note">Note</label><div class="field-shell textarea-control"><span class="field-icon" aria-hidden="true">${ico('note')}</span><textarea id="res-note" name="res-note" maxlength="2000">${esc(v.note)}</textarea></div><div class="error" role="alert"></div><div class="actions"><div id="reservation-capacity" class="full" role="status"></div><button type="submit" class="primary">Save reservation</button>${btn('Cancel','close')}</div></form>`,'reservation');updateReservationCapacity()}
function showNotifications(){reminders();showModal('Notifications',`${R().notifications.length?btn('Mark all read','notifications-read','','ghost'):''}${[...R().notifications].reverse().map(n=>`<button class="option row" style="width:100%;text-align:left" data-action="notification" data-id="${n.id}"><div class="grow"><strong>${esc(n.message)}</strong><div class="hint">${dateTime(n.at)}</div></div>${!n.read?'<span class="badge">New</span>':''}</button>`).join('')||empty('All quiet.','Dining and reservation reminders will appear here.')}`,'notifications')}
function menu(){const item=(icon,title,action,desc='')=>`<button class="menu-item" data-action="${action}"><span class="menu-symbol">${ico(icon)}</span><span class="grow"><strong>${title}</strong>${desc?`<small>${desc}</small>`:''}</span></button>`;showModal('Your entity',`<div class="menu-profile"><div class="avatar">${esc(U().name.slice(0,2).toUpperCase())}</div><div><strong>${esc(U().name)}</strong><div class="hint">${esc(U().role)}</div></div></div><div class="menu-items">${allowed('admin')?item('settings','Entity settings','settings','Areas, tables, team & preferences'):''}${item('calendar','Reservations','all-reservations')}${item('clock','Activity history','activity')}</div><div class="menu-items">${item('clock','My preferences','my-preferences',displayZone().replaceAll('_',' '))}${item('download','Install TablePing','install-app')}${item('grid','Connection & data','device-data')}${item('users','Switch user','switch-user')}${item('logout','Log out','logout')}</div><small class="menu-version"><a href="https://tableping.pro/" target="_blank" rel="noopener noreferrer">TablePing</a> · 2.1</small>`,'menu')}

function allReservations(){showModal('Reservations',`${btn('New reservation','new-reservation','','primary')}<div class="spacer"></div>${R().reservations.slice().sort((a,b)=>b.start-a.start).map(v=>`<div class="option"><div class="row between"><strong>${esc(v.name)} · ${v.size}</strong><span class="badge">${v.status}</span></div><p class="hint">${dateTime(v.start)} · ${v.tableIds.map(t=>esc(table(t).code)).join(' + ')}</p>${v.status==='Upcoming'?`<div class="actions">${btn('Seat','reservation-seat',v.id)}${btn('Edit','reservation-edit',v.id)}${btn('Cancel','reservation-cancel',v.id)}${btn('No-show','reservation-noshow',v.id)}</div>`:''}</div>`).join('')||empty('No reservations.','Reserve a table for your next guests.')}`,'all-reservations')}
function areaPanel(){return `<p class="muted">Give each part of your restaurant a simple name.</p>${R().areas.map((a,i)=>`<div class="option row"><span class="grow">${esc(a.name)}</span>${btn('Rename','area-rename',a.id,'ghost')}${btn('Move up','area-up',a.id,'ghost')}${iconbtn('close','area-delete','Delete '+a.name,a.id)}</div>`).join('')}<form id="area-form"><label for="area-name">New area</label><div class="row"><span class="field-shell raw-control"><span class="field-icon" aria-hidden="true">${ico('location')}</span><input id="area-name" name="name" required maxlength="60" placeholder="e.g. Garden"></span><button class="primary" type="submit">Add</button></div></form><div class="spacer"></div><div class="row wrap">${['AC','Non AC','Outdoor','Garden','First Floor'].filter(n=>!R().areas.some(a=>a.name.toLowerCase()===n.toLowerCase())).map(n=>btn(n,'area-suggestion',n)).join('')}</div>`}
function tablesPanel(){return `<p class="muted">Paste your table details. We’ll organise them for you.</p><label for="table-paste">Paste table list</label><div class="field-shell textarea-control"><span class="field-icon" aria-hidden="true">${ico('note')}</span><textarea id="table-paste" placeholder="AC&#10;A1, 4&#10;A2, 4&#10;&#10;Outdoor&#10;O1, 2">${esc(pasteText)}</textarea></div><p class="hint">Area name on its own line. Then table code, seats. Add areas first.</p><div class="actions">${btn('Preview tables','paste-preview','','primary')}${btn('Add individually','table-individual')}</div><div id="paste-preview">${pastePreviewHTML()}</div><h3>Current tables (${R().tables.length})</h3>${R().tables.map(t=>`<div class="option row"><div class="grow"><strong>${esc(t.code)}</strong><div class="hint">${esc(areaName(t.areaId))} · ${t.capacity} seats · ${t.state}</div></div>${btn('Edit','table-edit',t.id,'ghost')}${iconbtn('close','table-delete','Delete table '+t.code,t.id)}</div>`).join('')}`}
function pastePreviewHTML(){if(!pasteRows.length)return '';return `<h3>Check your tables</h3><p class="hint">Correct highlighted rows before saving. Existing tables will be kept.</p>${pasteRows.map((r,i)=>`<div class="preview-row"><span class="field-shell raw-control"><span class="field-icon" aria-hidden="true">${ico('hash')}</span><input aria-label="Table code row ${i+1}" data-row="${i}" data-key="code" value="${esc(r.code)}" maxlength="20"></span><div class="paste-area-chips">${R().areas.map(a=>`<label class="choice"><input type="radio" name="paste-area-${i}" data-row="${i}" data-key="areaId" value="${a.id}" ${a.id===r.areaId?'checked':''}><span>${ico('location')}${esc(a.name)}</span></label>`).join('')}</div><span class="field-shell raw-control"><span class="field-icon" aria-hidden="true">${ico('users')}</span><input type="number" min="1" max="100" step="1" aria-label="Seats row ${i+1}" data-row="${i}" data-key="capacity" value="${esc(r.capacity)}"></span></div><div class="error" id="row-error-${i}">${esc(pasteError(r,i))}</div>`).join('')}<div class="actions">${btn('Save '+pasteRows.length+' tables','paste-save','','primary')}${btn('Clear preview','paste-clear')}</div>`}
function pasteError(r,i){if(!r.code.trim())return 'Table code is required.';if(!r.areaId)return 'Choose an existing area.';if(!Number.isInteger(Number(r.capacity))||r.capacity<1||r.capacity>100)return 'Seats must be a whole number from 1 to 100.';if(R().tables.some(t=>t.code.toLowerCase()===r.code.trim().toLowerCase())||pasteRows.some((t,j)=>j!==i&&t.code.trim().toLowerCase()===r.code.trim().toLowerCase()))return 'Duplicate table code.';return ''}
function teamPanel(){return `<div class="notice">${R().users.filter(u=>u.active).length} of ${R().limit} active user accounts used, including your admin account.</div>${R().users.map(u=>`<div class="option row"><div class="grow"><strong>${esc(u.name)}</strong><div class="hint">${esc(u.username)} · ${u.role} · ${u.active?'Active':'Disabled'}</div></div>${btn('Edit','user-edit',u.id,'ghost')}${btn(u.active?'Disable':'Enable','user-toggle',u.id,'ghost')}</div>`).join('')}<div class="actions">${btn('Add team member','user-add','','primary')}</div><p class="hint">Admin: configuration and all operations. Supervisor: operations, merge and bulk corrections. Host: guests, reservations and routine table actions.</p>`}
function themePanel(){const s=R().settings;return `<p class="muted">A familiar feel for your team.</p><div class="spacer"></div><div class="row wrap">${btn('Restaurant green','theme-preset','green')}${btn('Midnight blue','theme-preset','blue')}${btn('Plum','theme-preset','plum')}</div><form id="theme-form"><div class="formgrid"><div>${field('primary','Primary colour','color',s.primary)}</div><div>${field('secondary','Secondary colour','color',s.secondary)}</div></div><div class="theme-preview"><div class="row between"><strong>Your restaurant</strong><span class="badge">TablePing</span></div><div class="spacer"></div><span class="badge" style="background:var(--free)">Free · 4 seats</span><div class="spacer"></div><button class="primary" type="submit">Save appearance</button></div><p class="hint">Colour choices must maintain readable contrast. Table status colours stay consistent.</p><div class="error" role="alert"></div></form>`}
function detailsPanel(){const r=R();return `<div class="notice">Registered identity is read-only. Generate a request to share with the TablePing team.</div>${[['name','Entity name'],['email','Registered email'],['phone','Registered phone'],['location','Location']].map(([k,n])=>field('detail-'+k,n,'text',r[k],'readonly')).join('')}<div class="actions">${btn('Request a change','change-request')}</div>`}
function operationsPanel(){const s=R().settings;return `<form id="operations-form">${select('refreshSeconds','Refresh tables automatically',[[5,'5 sec'],[10,'10 sec'],[15,'15 sec'],[30,'30 sec'],[60,'60 sec'],[0,'Manual']],s.refreshSeconds??5)}<p class="hint">Tap the live status to refresh any time. Open forms keep their values.</p>${field('duration','Expected dining duration (minutes)','number',s.duration,'min="5" max="1440" required step="1"')}${field('diningLead','Dining reminder lead time (minutes)','number',s.diningLead,'min="0" max="1440" required step="1"')}${field('resLead','Reservation reminder lead time (minutes)','number',s.resLead,'min="0" max="1440" required step="1"')}${timezonePicker('timezone','Entity default timezone',s.timezone)}<p class="hint">Used when a team member has not chosen their own timezone.</p>${[['sharing','Allow table sharing'],['cleanAfter','Move ended dining to Cleaning'],['notifications','Show in-app reminders']].map(([k,n])=>`<label class="check"><input type="checkbox" name="${k}" ${s[k]?'checked':''}>${n}</label>`).join('')}<div class="error" role="alert"></div><div class="actions"><button type="submit" class="primary">Save settings</button></div><p class="hint">Existing sessions retain their original expected duration. No automatic table release.</p></form>`}
const panels={areas:areaPanel,tables:tablesPanel,team:teamPanel,theme:themePanel,details:detailsPanel,operations:operationsPanel};
function showSettings(tab=settingsTab){permit('admin');settingsTab=tab;showModal('Entity settings',`<nav class="settingsnav">${[['details','Details'],['areas','Areas'],['tables','Tables'],['team','Team'],['theme','Appearance'],['operations','Operations']].map(([k,n])=>btn(n,'settings-tab',k,k===tab?'active':'')).join('')}</nav><div id="config-panel">${panels[tab]()}</div><div class="error" role="alert"></div>`,'settings')}
function refreshConfig(){if(!R().ready)renderSetup();else showSettings(settingsTab)}
function renderSetup(){const r=R(),i=r.setup,keys=['areas','tables','team','theme'],titles=['How is your restaurant arranged?','Add your tables.','Who’s on your team?','Make it yours.'];$('#root').innerHTML=`<section class="setup"><div class="row between">${brand()}${liveControl()}${btn('Log out','logout','','ghost')}</div><div class="stepper">${[0,1,2,3,4].map(n=>`<div class="step ${n<=i?'done':''}"></div>`).join('')}</div><span class="eyebrow">${i<4?`Setup ${i+1} of 4`:'Ready to go'}</span><div class="spacer"></div><h2>${i<4?titles[i]:'You’re ready to welcome guests.'}</h2><p class="setup-kindnote">${ico(i===4?'heart':'smile')}${['A lovely space for every guest.','Every table has a happy story.','Great hospitality is a team thing.','A little touch of your personality.','Here’s to more happy tables.'][i]}</p><div class="spacer"></div>${i<4?panels[keys[i]]():`<p class="muted">Your tables and team are set. Let’s seat your first guests.</p><div class="spacer"></div><div class="notice">${r.tables.length} tables across ${r.areas.length} areas · ${r.users.length} team members</div>`}<div class="error" id="form-error" role="alert"></div><div class="hr"></div><div class="row between setup-actions">${i>0?btn('Back','setup-back'):btn('Save & log out','logout','','ghost')}${btn(i===4?'Open TablePing':i===2?'Continue · team can be added later':'Continue','setup-next','','primary')}</div></section>`;}
function userForm(id=''){permit('admin');const u=id?R().users.find(u=>u.id===id):{name:'',username:'',role:'Host',pin:''};if(!id)assert(R().users.filter(u=>u.active).length<R().limit,'Account limit reached. Disable or edit existing users; contact the team to change your plan.');showModal(id?'Edit team member':'Add team member',`<form id="user-form" data-id="${id}">${field('user-name','Name','text',u.name,'required maxlength="100"')}${field('user-username','Username','text',u.username,'required pattern="[A-Za-z0-9_.-]{3,30}"')}${select('user-role','Role',['Admin','Supervisor','Host'],u.role)}${field('user-pin',id?'New six-digit PIN (leave blank to keep)':'Six-digit PIN','password','','pattern="[0-9]{6}" maxlength="6" inputmode="numeric" '+(id?'':'required'))}<div class="error" role="alert"></div><div class="actions"><button type="submit" class="primary">Save team member</button>${btn('Cancel','config-return')}</div></form>`,'user')}
function tableForm(id=''){permit('admin');assert(R().areas.length,'Add an area first.');const t=id?table(id):{code:'',capacity:4,areaId:R().areas[0].id};showModal(id?'Edit table':'Add table',`<form id="table-form" data-id="${id}">${field('table-code','Table code','text',t.code,'required maxlength="20"')}${field('table-capacity','Seats','number',t.capacity,'required min="1" max="100" step="1"')}${select('table-area','Area',R().areas.map(a=>[a.id,a.name]),t.areaId)}<div class="error" role="alert"></div><div class="actions"><button type="submit" class="primary">Save table</button>${btn('Cancel','config-return')}</div></form>`,'table-edit')}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function deviceData(){permit();showModal('Connection & data',`<div class="notice">${liveControl()}<br>Last checked: ${cloud.lastSync?dateTime(cloud.lastSync):'Not yet checked'}</div><p class="hint">Your restaurant is connected to TablePing. Updates are saved securely online. An internet connection is required to change tables or guest details.</p><p class="hint">Automatic refresh: ${(R().settings.refreshSeconds??5)===0?'Manual only':(R().settings.refreshSeconds??5)+' seconds'} · License valid through ${esc(R().licenseValidTo)} (UTC).</p>${allowed('admin')?`<div class="actions">${btn('Export restaurant data','export')}${btn('Refresh settings','settings-tab','operations')}</div>`:''}<div class="error" role="alert"></div>`,'connection')}


/* EVENT HANDLING */
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
const actions={
'enable-sharing'(id){askConfirm('Allow table sharing?','Staff will be able to allocate unused seats to another party across this entity. Confirm that sharing is suitable for your service.',()=>{commit('Table sharing enabled',()=>R().settings.sharing=true,'admin');showTable(id)})},
'picker-select'(id,button){const details=button.closest('details');const name=details.dataset.picker;const input=$('input[type="hidden"]',details);input.value=id;$('#'+name+'-selection').textContent=button.dataset.label;$$('.picker-option',details).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.id===id)));details.open=false;$('summary',details).focus();},
'my-preferences'(){permit();showModal('My preferences',`<form id="preferences-form">${timezonePicker('user-timezone','My display timezone',displayZone())}<p class="hint">All dates and reservation entry use this timezone. Changing it never changes the time a guest is booked.</p><div class="notice">Current time: ${dateTime(now())}</div><div class="error" role="alert"></div><div class="actions"><button type="submit" class="primary">Save preferences</button>${btn('Use device timezone','device-timezone')}</div></form>`,'preferences')},
'device-timezone'(){const z=Intl.DateTimeFormat().resolvedOptions().timeZone;assert(validZone(z),'Device timezone unavailable.');$('#user-timezone').value=z;$('#user-timezone-selection').textContent=zoneLabel(z);const picker=$('[data-picker="user-timezone"]');if(picker)$$('.picker-option',picker).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===z)));},
'quick-review'(){guestForm(parseGuest(draft,partySize))},'guest-pick'(id){const f=$('#guest-form');if(!f.reportValidity())return;directTable=id;preferredTable=id;forms['guest-form'](f,Object.fromEntries(new FormData(f)))},
'install-app'(){if(installPrompt){installPrompt.prompt();installPrompt=null;closeModal()}else showModal('Install TablePing',`<p>Open this app from an HTTPS website first.</p><div class="spacer"></div><p><strong>iPhone / iPad:</strong> In Safari, tap Share, then Add to Home Screen.</p><div class="spacer"></div><p><strong>Android / desktop:</strong> Use your browser’s Install app or Add to Home screen option.</p><div class="spacer"></div><div class="notice">The installed app needs an internet connection to load restaurant data and save changes. Installation is unavailable when opening a downloaded HTML file directly.</div>`)},
close:closeModal,welcome(){screen='welcome';render()},'login-page'(){screen='login';render()},'register-page'(){screen='register1';render()},'toggle-pin'(id){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password'},forgot(){showModal('Recover your PIN',`<p>Contact your restaurant administrator for help accessing your account.</p><div class="spacer"></div><p class="hint">An administrator can set a new PIN in Team settings. Administrators who cannot log in should contact the TablePing team; PINs cannot be retrieved.</p><div class="actions">${btn('Close','close')}</div>`)},'check-activation'(id){const r=db.restaurants.find(r=>r.id===id);if(r.active){screen='login';db.remember=r.code;render();toast('Restaurant activated. Log in to finish setup.')}else toast('Activation is still pending.')},
'device-data':deviceData,menu,notifications:showNotifications,settings(){showSettings()},'settings-tab':showSettings,'all-reservations':allReservations,'new-reservation'(){reservationForm()},activity(){showModal('Activity history',R().events.slice().reverse().slice(0,100).map(e=>`<div class="option"><p>${esc(e.message)}</p><small>${dateTime(e.at)}</small></div>`).join('')||empty('No activity yet.','Table and guest changes will be recorded here.'))},'switch-user'(){closeModal();db.remember=R().code;db.session=null;screen='login';selection.clear();selecting=false;persist();render()},logout(){closeModal();db.session=null;selection.clear();selecting=false;draft='';partySize=null;screen='welcome';persist();render()},

async function cloudAPI(action,payload={}){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{const response=await fetch(SUPABASE.url+'/rest/v1/rpc/tp_mobile_api',{method:'POST',headers:{apikey:SUPABASE.key,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_payload:payload,p_token:cloud.token}),signal:controller.signal});
 if(!response.ok){const err=Error('Connection unavailable. Please try again.');err.network=true;throw err}
 const result=await response.json();if(!result.ok){const err=Error(result.error||'Unable to complete this action.');err.code=result.code;throw err}return result;
 }catch(err){if(err.name==='AbortError'||err instanceof TypeError){const e=Error('Connection lost. Refresh to check whether the last change was saved.');e.network=true;throw e}throw err}finally{clearTimeout(timeout)}
}

 const currentPrefs=U()?.id===result.userId?U().prefs:null;const oldNotifications=R()?.notifications||[];

 r.notifications.forEach(n=>{if(oldNotifications.find(old=>old.key===n.key)?.read)n.read=true});
 db={version:VERSION,offset:0,restaurants:[r],session:{restaurantId:r.id,userId:result.userId},remember:rememberedUsername()};
 cloud.revision=result.revision;cloud.lastSync=Date.now();cloud.status='Live';cloud.deferred=null;storageWarning='';Repository.save();

 if(cloud.busy){toast('Please wait for the current change to finish.');return}
 if(cloud.polling){await cloud.pollDone;if(cloud.busy)return}
 cloud.busy=true;const before=clone(db),sessionBefore=db.session?.userId,stateBefore=R()?serialState(R()):'';
 const prefsBefore=U()?JSON.stringify(U().prefs):'';pendingMessage='';
 try{
  await fn();
  if(R()&&sessionBefore===db.session?.userId&&serialState(R())!==stateBefore){
   if(navigator.onLine===false){const offline=Error('You are offline. This change was not saved. Reconnect and try again.');offline.network=true;throw offline}
   showBusy(true,'Saving changes…');
   const result=await cloudAPI('save',{revision:cloud.revision,restaurant:R(),message:pendingMessage||'Restaurant updated'});
   applyCloud(result);if(pendingMessage)toast(pendingMessage);
  }
  if(R()){if(sessionBefore===U().id&&JSON.stringify(U().prefs)!==prefsBefore)await cloudAPI('preferences',{prefs:U().prefs});persist();if(!$('#modal').open)render();paintLive()}
 }catch(err){
  if(sessionBefore){db=before;render()}
  if(err.code==='SESSION_ENDED')endCloudSession();
  else if(err.code==='CONFLICT'||err.network){cloud.status=err.network?'Retry':'Updated';cloud.deferred=null;try{if(cloud.token){applyCloud(await cloudAPI('sync'));if(!$('#modal').open)render()}}catch{cloud.status='Offline'} }
  if($('#modal').open)modalError(err);else formError(err);toast(err.message);paintLive();
 }finally{cloud.busy=false;showBusy(false);scheduleRefresh()}
}
function editingScreen(){return $('#modal').open||screen==='setup'||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)}
async function refreshCloud(manual=false){
 if(!cloud.token||cloud.busy||cloud.polling)return;
 cloud.polling=true;cloud.pollDone=new Promise(resolve=>{cloud.finishPoll=resolve});
 try{const result=await cloudAPI('sync');cloud.lastSync=Date.now();
  if(editingScreen()&&result.revision!==cloud.revision){cloud.deferred=result;cloud.status='Live';if(manual)toast('New updates are available. Finish or close the open form; your entry is preserved.')}
  else {applyCloud(result);if(!editingScreen())render();if(manual)toast('Tables refreshed.')}
 }catch(err){cloud.status=navigator.onLine===false?'Offline':'Retry';if(err.code==='SESSION_ENDED'){endCloudSession();toast(err.message)}else if(manual)toast(err.message)}
 finally{cloud.polling=false;cloud.finishPoll?.();cloud.finishPoll=null;cloud.pollDone=null;paintLive();scheduleRefresh()}
}
function scheduleRefresh(){clearTimeout(cloud.timer);if(!cloud.token)return;const seconds=R()?.settings.refreshSeconds??5;if(seconds>0)cloud.timer=setTimeout(()=>{if(document.hidden)scheduleRefresh();else refreshCloud()},seconds*1000)}
async function restoreCloudSession(){try{cloud.token=sessionStorage.getItem('tableping.session')||''}catch{}if(!cloud.token)return;cloud.busy=true;showBusy(true,'Opening your restaurant…');try{applyCloud(await cloudAPI('sync'));render()}catch(err){endCloudSession();toast(err.message)}finally{cloud.busy=false;showBusy(false);scheduleRefresh()}}
actions['refresh-cloud']=()=>{setTimeout(()=>refreshCloud(true),0)};
actions.logout=async()=>{if(cloud.token)await cloudAPI('logout');endCloudSession();draft='';partySize=null;selection.clear();selecting=false;screen='welcome';render()};
actions['switch-user']=async()=>{if(cloud.token)await cloudAPI('logout');endCloudSession();draft='';partySize=null;selection.clear();selecting=false;render()};
actions.import=()=>{throw Error('Cloud records cannot be replaced from a device backup. Contact TablePing for a reviewed import.')};

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const fn=actions[b.dataset.action];if(!fn)return;e.preventDefault();if(['menu','notifications','close'].includes(b.dataset.action)){try{if(b.dataset.action!=='close')permit();fn(b.dataset.id||'',b)}catch(err){formError(err)}return;}runInteraction(()=>fn(b.dataset.id||'',b))});
document.addEventListener('submit',e=>{const f=e.target;if(!forms[f.id])return;e.preventDefault();if(!f.reportValidity())return;runInteraction(()=>forms[f.id](f,Object.fromEntries(new FormData(f))))});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='merge-required'){partySize=Number(el.value)||null;$('#selection-capacity').innerHTML=seatFeedback([...selection].reduce((n,id)=>n+(unit(id)?.capacity||0),0),partySize)}if(el.id==='res-size')updateReservationCapacity();if(el.dataset.pickerSearch){const container=el.closest('details');const q=el.value.trim().toLowerCase();let count=0;$$('.picker-option',container).forEach(b=>{b.hidden=!((b.dataset.label+' '+b.dataset.id).toLowerCase().includes(q));if(!b.hidden)count++});$('.picker-empty',container).hidden=count!==0;}if(el.id==='quick-entry'){draft=el.value;updateQuickAvailability()}if(['guest-name','guest-size','guest-phone'].includes(el.id)||el.name==='guest-area')updateGuestAvailability();if(el.id==='table-paste')pasteText=el.value;if(el.id==='search'){const start=el.selectionStart;search=el.value;render();$('#search').focus();$('#search').setSelectionRange(start,start)}if(['primary','secondary'].includes(el.id))previewTheme();if(el.dataset.row!==undefined){pasteRows[Number(el.dataset.row)][el.dataset.key]=el.value;pasteRows.forEach((r,i)=>{const er=document.getElementById('row-error-'+i);if(er)er.textContent=pasteError(r,i)})}});
document.addEventListener('change',e=>{const el=e.target;if(el.name==='res-table')updateReservationCapacity();if(el.dataset.row!==undefined){pasteRows[Number(el.dataset.row)][el.dataset.key]=el.value;pasteRows.forEach((r,i)=>{const er=document.getElementById('row-error-'+i);if(er)er.textContent=pasteError(r,i)})}});
$('#modal').addEventListener('close',finishSheetClose);
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
window.addEventListener('offline',()=>{cloud.status='Offline';paintLive()});
window.addEventListener('online',()=>refreshCloud());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});
function keyboardInset(){const viewport=window.visualViewport;document.documentElement.style.setProperty('--sheet-viewport-height',(viewport?.height||window.innerHeight||800)+'px');if(!viewport)return;const inset=Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop);document.documentElement.style.setProperty('--keyboard-inset',inset+'px')}if(window.visualViewport){window.visualViewport.addEventListener('resize',keyboardInset);window.visualViewport.addEventListener('scroll',keyboardInset)}
if(db.session){screen='workspace'}render();keyboardInset();restoreCloudSession();
if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>toast('Offline setup failed. Keep this page open or try again online.')))}

// Directional controls stay available during entry, selection and modal work.
let lastWorkspaceY=0,scrollTravel=0,scrollDirection=0;
window.addEventListener('scroll',()=>{
 const y=Math.max(0,window.scrollY||0),delta=y-lastWorkspaceY;lastWorkspaceY=y;
 if(document.body.dataset.sheetOpen==='true')return;
 const protectedEntry=selecting||Boolean(draft)||Boolean(partySize)||document.activeElement?.closest?.('.composer-wrap');
 if(protectedEntry||y<32||y+window.innerHeight>=document.documentElement.scrollHeight-12){document.body.dataset.composerHidden='false';scrollTravel=0;return;}
 const direction=Math.sign(delta);if(direction!==scrollDirection){scrollTravel=0;scrollDirection=direction}scrollTravel+=Math.abs(delta);
 if(scrollTravel>=18){document.body.dataset.composerHidden=direction>0?'true':'false';scrollTravel=0;}
},{passive:true});
document.addEventListener('focusin',e=>{if(e.target.closest?.('.composer-wrap'))document.body.dataset.composerHidden='false'});
window.addEventListener('resize',keyboardInset);
document.addEventListener('keydown',e=>{
 if(document.body.dataset.sheetFallback!=='true')return;
 if(e.key==='Escape'){e.preventDefault();closeModal();return;}
 if(e.key==='Tab'){const nodes=Array.from($('#modal').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],summary,[tabindex="0"]')).filter(n=>n.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}
});
</script></body></html>
